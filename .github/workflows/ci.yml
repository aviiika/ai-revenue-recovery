name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint, typecheck and test only. No deploy step, per spec section 7 (DevOps).
jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest

    services:
      # Tests run against real PostgreSQL in CI: JSONB behaviour and CHECK
      # constraints are dialect-specific, and the local SQLite default would
      # let some of them through unnoticed.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revrec
          POSTGRES_PASSWORD: revrec
          POSTGRES_DB: revrec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revrec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://revrec:revrec@localhost:5432/revrec
      TEST_DATABASE_URL: postgresql+psycopg://revrec:revrec@localhost:5432/revrec_test
      RAZORPAY_MODE: test
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Create the test database
        run: PGPASSWORD=revrec psql -h localhost -U revrec -d revrec -c "CREATE DATABASE revrec_test OWNER revrec;"

      - name: Install
        # The train extra is needed so the ML tests exercise the real
        # scikit-learn path rather than only the fallback.
        run: python -m pip install -e "apps/api[dev]" -e ".[train]" pandas-stubs

      - name: Lint
        run: python -m ruff check apps/api/app apps/api/tests ml

      - name: Format check
        run: python -m ruff format --check apps/api/app apps/api/tests ml

      - name: Typecheck
        run: python -m mypy app
        working-directory: apps/api

      - name: Migrations apply cleanly
        run: python -m alembic upgrade head
        working-directory: apps/api

      - name: Train the model (also proves the pipeline runs end to end)
        run: python -m ml.src.train --count 2000 --no-write

      - name: Test
        run: python -m pytest -q
        working-directory: apps/api

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
