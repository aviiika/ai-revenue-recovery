[project]
name = "revrec-ml"
version = "0.1.0"
description = "Shared synthetic data generation and ML pipeline for the AI Revenue Recovery Agent"
requires-python = ">=3.12"
# Runtime deps are deliberately empty: the synthetic generator uses only the
# standard library, so the API can depend on it without pulling in the whole
# scientific stack. pandas/scikit-learn arrive in the `train` extra at
# Milestone 2, which is when anything actually needs them.
dependencies = []

[project.optional-dependencies]
train = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# ml/ lives outside apps/api, so it gets its own config rather than inheriting
# the backend's by accident. Kept deliberately in step with apps/api.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE", "DTZ"]
ignore = [
    # `Depends(...)` / `Query(...)` in a signature default IS the FastAPI
    # dependency-injection idiom, so B008 fires on correct code. This config
    # governs whole-repo linting (what CI runs), so it must stay in step with
    # apps/api/pyproject.toml.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# X_train / X_test is the universal scikit-learn convention for a design matrix
# (capital X = 2-D features, lowercase y = 1-D target). Renaming to satisfy
# pep8-naming would make this less readable to anyone who knows sklearn.
"ml/src/train.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "tests"]

[tool.setuptools]
# Explicit rather than auto-discovered: the repo root also holds apps/, docs/
# and infra/, none of which are Python packages.
packages = ["ml", "ml.src"]
